name: TravelHour landmark data
concurrency:
  group: th-fetch
  cancel-in-progress: true
on:
  push:
    branches: [travelhour-social]
    paths: [tools/fetch_landmarks.py, data/landmark_titles.json]
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install requests
      - run: python tools/fetch_landmarks.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - run: |
          git config user.name "travelhour-social"
          git config user.email "noreply@travelhour.app"
          git add data/landmarks.json data/landmarks_problems.txt assets/photos assets/clips
          git commit -m "Update landmark data and photos" || exit 0
          git pull --rebase -X theirs origin travelhour-social
          git push origin HEAD:travelhour-social
